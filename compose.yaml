name: filex

# Container baseline from docs/reviews/security-architecture-review.md section 2.1 (ADR-0007).
# Applied to every service, API and Redis included (review L3). Only /data and tmpfs are writable.
# Never add: privileged, the Docker socket, host bind mounts, or ports on workers/Redis.
# Each service keeps its own non-root uid: api and workers share 10001 because they share the
# files on filex-data; Redis (Valkey) runs as its image's valkey user.
x-hardening: &hardening
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]  # keeps Docker's default seccomp profile
  # No `init` here (review I-4): api and redis set `init: true` themselves, and every worker sets
  # `init: false` (the runner must be PID 1), so a new worker that forgets it does not get tini.
  ipc: private
  pids_limit: 256
  ulimits: { nofile: 1024, core: 0 }
  tmpfs: ["/tmp:size=64m,mode=1777,nosuid,nodev,noexec"]
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  restart: unless-stopped

# Redis ACL users (ADR-0007 item 3, task 54). Passwords are Docker secret files, never env vars:
# create them with `python scripts/make_secrets.py`. Each service mounts only its own.
x-redis-env: &redis-env
  FILEX_REDIS_URL: redis://redis:6379/0

# Worker settings shared by every worker group (ADR-0002 amendment).
x-worker-env: &worker-env
  <<: *redis-env
  FILEX_REDIS_USER: worker
  FILEX_REDIS_PASSWORD_FILE: /run/secrets/redis_worker_password
  FILEX_CONCURRENCY: ${FILEX_CONCURRENCY:-1}
  FILEX_HEAVY_SLOTS: ${FILEX_HEAVY_SLOTS:-1}
  FILEX_RETENTION_MIN: ${FILEX_RETENTION_MIN:-1440}
  FILEX_MIN_FREE_MB: ${FILEX_MIN_FREE_MB:-4096}
  FILEX_MAX_PAGES: ${FILEX_MAX_PAGES:-2000}
  FILEX_MAX_PIXELS: ${FILEX_MAX_PIXELS:-100000000}
  FILEX_LANDLOCK: ${FILEX_LANDLOCK:-auto}

services:
  api:
    <<: *hardening
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    image: filex-api:local
    init: true
    # Loopback by default (review C1). Never 0.0.0.0: published ports bypass the host firewall.
    ports: ["${FILEX_BIND:-127.0.0.1}:${FILEX_PORT:-8080}:8080"]
    networks: [default, internal]
    volumes: [filex-data:/data]
    secrets: [redis_api_password]
    environment:
      <<: *redis-env
      FILEX_REDIS_USER: api
      FILEX_REDIS_PASSWORD_FILE: /run/secrets/redis_api_password
      FILEX_AUTH: ${FILEX_AUTH:-}
      # The same value as the port binding above: FILEX_AUTH=none refuses a non-loopback bind.
      FILEX_BIND: ${FILEX_BIND:-127.0.0.1}
      KEEL_URL: ${KEEL_URL:-}
      KEEL_ANON_KEY: ${KEEL_ANON_KEY:-}
      FILEX_API_TOKENS: ${FILEX_API_TOKENS:-}
      FILEX_TRUSTED_PROXIES: ${FILEX_TRUSTED_PROXIES:-127.0.0.1}
      FILEX_ALLOWED_USER_IDS: ${FILEX_ALLOWED_USER_IDS:-}
      FILEX_ALLOWED_HOSTS: ${FILEX_ALLOWED_HOSTS:-localhost,127.0.0.1}
      FILEX_MAX_UPLOAD_MB: ${FILEX_MAX_UPLOAD_MB:-1024}
      FILEX_MAX_FILES: ${FILEX_MAX_FILES:-50}
      FILEX_RETENTION_MIN: ${FILEX_RETENTION_MIN:-1440}
      FILEX_MIN_FREE_MB: ${FILEX_MIN_FREE_MB:-4096}
      FILEX_MAX_QUEUED: ${FILEX_MAX_QUEUED:-20}
      FILEX_HSTS: ${FILEX_HSTS:-false}
      FILEX_DL_KEY_FILE: ${FILEX_DL_KEY_FILE:-}
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    depends_on:
      redis: { condition: service_healthy }

  # Valkey (BSD-3-Clause), the open-source fork of Redis, speaking the same protocol: Streams,
  # consumer groups and ACL selectors work unchanged. The service keeps the name `redis` (it is
  # the hostname in FILEX_REDIS_URL and the name in every doc and secret).
  redis:
    <<: *hardening
    # valkey/valkey:8.1-alpine, pinned by its multi-arch index digest (plan task 66; Dependabot
    # bumps it).
    image: valkey/valkey:8.1-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    init: true
    user: "999:1000"  # the image's own valkey uid/gid
    # No persistence (ADR-0001), no ports. ACL users api and worker, default user off
    # (ADR-0007 item 3): start.sh renders the read-only users.acl with the password hashes from
    # the secret files onto tmpfs and execs valkey-server.
    entrypoint: ["sh", "/etc/filex-redis/start.sh"]
    command: []
    configs:
      - { source: redis_acl, target: /etc/filex-redis/users.acl }
      - { source: redis_start, target: /etc/filex-redis/start.sh }
    secrets: [redis_api_password, redis_worker_password]
    tmpfs: ["/data:size=16m,nosuid,nodev,noexec", "/tmp:size=16m,mode=1777,nosuid,nodev,noexec"]
    networks: [internal]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      # No credentials in the healthcheck: an unauthenticated PING answers NOAUTH (default user
      # off), which proves the server is up and serving commands without a password in env.
      test: ["CMD-SHELL", "valkey-cli ping 2>&1 | grep -qE '^(PONG|NOAUTH)'"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker-core:
    <<: *hardening
    build: { context: ., dockerfile: docker/Dockerfile, target: worker-core }
    image: filex-worker-core:local
    # No init (ADR-0007, security review H-1): the exec-form CMD makes the runner PID 1, which
    # the kernel shields from SIGSTOP/SIGKILL sent by a step. The runner reaps zombies itself.
    init: false
    networks: [internal]  # the only network: no egress
    volumes: [filex-data:/data]
    secrets: [redis_worker_password]
    environment:
      <<: *worker-env
    # FILEX_MEM_<GROUP> sets both: no swap beyond the limit. Other groups use FILEX_MEM_OFFICE,
    # FILEX_MEM_OCR and FILEX_MEM_EBOOK the same way (defaults 1536m, 1536m, 1g).
    mem_limit: ${FILEX_MEM_CORE:-1g}
    memswap_limit: ${FILEX_MEM_CORE:-1g}
    cpus: 1.5
    depends_on:
      redis: { condition: service_healthy }

  # LibreOffice headless (ADR-0002 `office` group): COMPOSE_PROFILES=office (or all).
  # Wired exactly like worker-core; its steps are heavy (slot:heavy, FILEX_HEAVY_SLOTS).
  worker-office:
    <<: *hardening
    profiles: [office, all]
    build: { context: ., dockerfile: docker/Dockerfile, target: worker-office }
    image: filex-worker-office:local
    init: false  # the runner is PID 1, see worker-core
    networks: [internal]  # the only network: no egress
    volumes: [filex-data:/data]
    secrets: [redis_worker_password]
    environment:
      <<: *worker-env
      # Always one step at a time, whatever FILEX_CONCURRENCY says (security review L-2): steps
      # in one container can read each other's argv in /proc, which names the other step's
      # LibreOffice profile, and from it the OSL_PIPE name a hostile step could connect() to or
      # unlink. One step per container means there is no other soffice to find.
      FILEX_CONCURRENCY: "1"
    mem_limit: ${FILEX_MEM_OFFICE:-1536m}
    memswap_limit: ${FILEX_MEM_OFFICE:-1536m}
    cpus: 1.5
    depends_on:
      redis: { condition: service_healthy }

  # OCRmyPDF + Tesseract (ADR-0002 `ocr` group): COMPOSE_PROFILES=ocr (or all). Heavy steps.
  # Extra Tesseract languages are baked in at build time: FILEX_OCR_EXTRA_LANGS=ukr,bel in .env,
  # then `docker compose build worker-ocr && docker compose up -d`.
  worker-ocr:
    <<: *hardening
    profiles: [ocr, all]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker-ocr
      args: { FILEX_OCR_EXTRA_LANGS: "${FILEX_OCR_EXTRA_LANGS:-}" }
    image: filex-worker-ocr:local
    init: false  # the runner is PID 1, see worker-core
    networks: [internal]  # the only network: no egress
    volumes: [filex-data:/data]
    secrets: [redis_worker_password]
    environment:
      <<: *worker-env
    mem_limit: ${FILEX_MEM_OCR:-1536m}
    memswap_limit: ${FILEX_MEM_OCR:-1536m}
    cpus: 1.5
    depends_on:
      redis: { condition: service_healthy }

  # Calibre, Pandoc, djvulibre, unar (ADR-0002 `ebook` group): COMPOSE_PROFILES=ebook (or all).
  # Heavy steps. Qt runs headless (QT_QPA_PLATFORM=offscreen, set in the image).
  worker-ebook:
    <<: *hardening
    profiles: [ebook, all]
    build: { context: ., dockerfile: docker/Dockerfile, target: worker-ebook }
    image: filex-worker-ebook:local
    init: false  # the runner is PID 1, see worker-core
    networks: [internal]  # the only network: no egress
    volumes: [filex-data:/data]
    secrets: [redis_worker_password]
    environment:
      <<: *worker-env
    mem_limit: ${FILEX_MEM_EBOOK:-1g}
    memswap_limit: ${FILEX_MEM_EBOOK:-1g}
    cpus: 1.5
    depends_on:
      redis: { condition: service_healthy }

networks:
  # internal: true = no route out, but by default the host still owns the bridge's gateway
  # address, and any host service listening on 0.0.0.0 answers a worker there (review M6,
  # checked 2026-10-10: docs/reviews/m6-gateway-check.md). inhibit_ipv4 (recent engines,
  # verified on 29.8) gives the host no address on this bridge at all; the pinned subnet is what
  # a host INPUT rule drops on older engines. Check with: sh scripts/check_gateway.sh
  internal:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${FILEX_INTERNAL_SUBNET:-10.213.83.0/24}

volumes:
  filex-data:

# Git-ignored files from `python scripts/make_secrets.py`; compose refuses to start without them.
secrets:
  redis_api_password: { file: ./secrets/redis_api_password }
  redis_worker_password: { file: ./secrets/redis_worker_password }

configs:
  redis_acl: { file: ./docker/redis/users.acl }
  redis_start: { file: ./docker/redis/start.sh }
